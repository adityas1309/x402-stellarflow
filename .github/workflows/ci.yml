name: StellarFlow CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json
            middleware/node/package-lock.json
      - run: npm ci
      - run: npm --prefix middleware/node ci
      - run: npm --prefix middleware/node run build
      - run: npm --prefix mcp-server ci
      - run: npm --prefix mcp-server run build
      - run: npm test

  rust:
    needs: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo test --locked --manifest-path contracts/spending_limits/Cargo.toml
      - run: cargo test --locked --manifest-path contracts/audit_log/Cargo.toml

  go:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
      - run: go test ./...
        working-directory: backend

  python:
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q middleware/python/x402_middleware
